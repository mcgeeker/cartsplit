name: Deploy Worker

# Historical upstream service. This personal-token fork does not deploy it.
# Keep manual dispatch disabled as well while publishing is on hold.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ false }} # Retained history only; requires a separate scope decision.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Deploy with the workspace-pinned wrangler so it matches the version the
      # CI dry-run validates against. wrangler reads these from env.
      - name: Deploy worker
        run: pnpm --filter worker exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
